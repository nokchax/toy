# PR 마다 GitHub 러너에서 테스트만 돌린다.
# pull_request 는 반드시 GitHub 호스팅 러너(ubuntu-latest)에서만. NAS 러너(self-hosted)를 쓰지 않는다.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
