spring:
  application:
    name: toy-bot
  profiles:
    default: local
  config:
    # 공통 설정(DB · JPA · Flyway) + 로컬 실행 시 프로젝트 루트의 .env (없으면 무시). Docker 에서는 compose 가 환경변수로 넣어준다
    import:
      - classpath:toy-common.yaml
      - optional:file:.env[.properties]

toy:
  telegram:
    # .env 또는 환경변수 TOY_TELEGRAM_TOKEN, TOY_TELEGRAM_ALLOWED_CHAT_IDS (쉼표 구분)
    token: ${TOY_TELEGRAM_TOKEN:}
    allowed-chat-ids: ${TOY_TELEGRAM_ALLOWED_CHAT_IDS:}
  notification:
    # 텔레그램 발송은 bot 앱만 한다. 다른 앱(crawler, internal)이 쌓은 알림은 이 주기로 훑어서 보낸다
    sweep-interval: 5s
