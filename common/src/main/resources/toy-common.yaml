# 네 앱(bot, crawler, internal, external)이 함께 쓰는 설정. 각 앱의 application.yaml 이 import 한다.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        timezone:
          default_storage: NORMALIZE
  # 모든 앱이 시작할 때 마이그레이션한다 (Flyway 가 DB 락으로 동시 실행을 막는다).
  # 일부 앱만 배포해도 새 마이그레이션이 적용되고, 예전 버전 앱은 모르는 마이그레이션을 무시한다 (기본값 *:future).
  flyway:
    locations: classpath:db/migration

toy:
  # 인터널 · 익스터널이 다루는 크롤의 주인 chat id. 크롤은 chat 단위로 저장되고 알림도 이 chat 으로 간다
  owner-chat-id: ${TOY_OWNER_CHAT_ID:0}
  crawl:
    max-failures: 5
    max-crawls-per-chat: 30

logging:
  level:
    com.nokchax.toy: info

---
# 로컬 개발: MySQL 없이 H2 파일 DB (MySQL 모드). AUTO_SERVER 로 여러 앱이 같은 파일을 함께 연다
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/toy;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""

---
# NAS MySQL. DB_URL, DB_USERNAME, DB_PASSWORD 는 환경변수로
spring:
  config:
    activate:
      on-profile: dev | prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
